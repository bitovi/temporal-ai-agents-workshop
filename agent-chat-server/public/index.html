<!DOCTYPE html>
<html>

<head>
  <title>Agent Workflow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <h1>Agent Workflow</h1>
      <div class="status" id="status">Start a conversation to begin.</div>
      <div class="spacer"></div>
      <div class="conversation-row">
        <div id="conversationId">No active conversation</div>
        <a id="temporalUiLink" href="#" target="_blank" style="display: none;">
          <button class="secondary" type="button" title="Open in Temporal UI"
            style="white-space: nowrap; font-size: 12px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px;"><img
              src="http://localhost:8233/favicon.ico" style="width: 14px; height: 14px; vertical-align: middle;" />
            Temporal UI</button>
        </a>
      </div>
      <button onclick="createConversation()">New Conversation</button>
    </div>

    <div id="events-section">
      <div class="swimlane-grid two-col" id="swimlane-grid">
        <div class="lane-header user">
          User
        </div>
        <div class="lane-header client" id="client-lane-header">
          Agent
          <div class="lane-pills" id="pills-client">
            <span class="pill active" data-state="idle">Idle</span>
            <span class="pill" data-state="thinking">Thinking<span class="pill-dots"><span class="pill-dot"></span><span
                  class="pill-dot"></span><span class="pill-dot"></span></span></span>
            <span class="pill" data-state="acting">Acting<span class="pill-dots"><span class="pill-dot"></span><span
                  class="pill-dot"></span><span class="pill-dot"></span></span></span>
            <span class="pill" data-state="observing">Observing<span class="pill-dots"><span
                  class="pill-dot"></span><span class="pill-dot"></span><span class="pill-dot"></span></span></span>
            <span class="pill" data-state="compacting">Compacting<span class="pill-dots"><span
                  class="pill-dot"></span><span class="pill-dot"></span><span class="pill-dot"></span></span></span>
          </div>
        </div>
        <div class="lane-header remote">
          Remote Agent
          <div class="lane-pills" id="pills-remote">
            <span class="pill active" data-state="idle">Idle</span>
            <span class="pill" data-state="working">Working<span class="pill-dots"><span class="pill-dot"></span><span
                  class="pill-dot"></span><span class="pill-dot"></span></span></span>
            <span class="pill" data-state="awaiting_input">Awaiting Input<span class="pill-dots"><span
                  class="pill-dot"></span><span class="pill-dot"></span><span class="pill-dot"></span></span></span>
          </div>
        </div>
        <div class="swimlane-body" id="swimlane-body">
          <div id="events-empty">No activity yet.<br>Start a conversation and send a message to see the agent's steps
            here.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="messagePanel">
    <div class="message-inner">
      <textarea id="messageInput" placeholder="Type your message… (Enter to send, Shift+Enter for new line)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <div class="btn-column">
        <div class="secondary-row">
          <button onclick="compactConversation()">Compact</button>
          <button onclick="exitConversation()" class="danger">Exit</button>
        </div>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</body>

</html>
