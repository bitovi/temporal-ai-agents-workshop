services:
  temporal-dev-server:
    container_name: temporal-dev-server
    image: temporalio/temporal:latest
    command:
      ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - 7233:7233
      - 8233:8233
    networks:
      - docker-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8233",
        ]
      interval: 10s
      timeout: 30s
      retries: 3

  agent-chat-server:
    container_name: agent-chat-server
    build:
      context: ./agent-chat-server
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - TEMPORAL_HOST_PORT=temporal-dev-server:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=bitovi-ai-agents-workshop
      - PORT=3000
    networks:
      - docker-network
    depends_on:
      temporal-dev-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

