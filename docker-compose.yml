services:
  temporal-dev-server:
    container_name: temporal-dev-server
    image: debian:stable
    command: >
      bash -c '\
        apt update && \
        apt install -y curl && \
        curl -sSf https://temporal.download/cli.sh | sh && \
        PATH="\$PATH:/root/.temporalio/bin" >> ~/.bashrc && \
        source ~/.bashrc && \
        temporal server start-dev --namespace default --ip 0.0.0.0
      '
    ports:
      - 7233:7233
      - 8233:8233
    networks:
      - docker-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8233/ || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 3

  agent-chat-server:
    container_name: agent-chat-server
    build:
      context: ./agent-chat-server
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - TEMPORAL_HOST_PORT=temporal-dev-server:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=agent-queue
      - PORT=3000
    networks:
      - docker-network
    depends_on:
      temporal-dev-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
      - 6334:6334
    restart: always
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - docker-network
    healthcheck:
      test: ["CMD-SHELL", "apt update && apt install -y curl && curl --fail http://localhost:6333/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  postgres:
    container_name: postgres-db
    image: postgres:14-bookworm
    command: postgres -c 'max_connections=200'
    networks:
      - docker-network    
    ports:
      - 5432:5432
    restart: always
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PASSWORD=dbpassword
      - POSTGRES_USER=dbuser
      - POSTGRES_DB=workshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d workshop"]
      interval: 10s
      timeout: 5s
      retries: 5
  mock-mcp-server-ts:
    container_name: mock-mcp-server-ts
    build:
      context: ./mock-mcp-server-ts
      dockerfile: Dockerfile
    ports:
      - 8090:8090
    networks:
      - docker-network
    healthcheck:
      test: ["CMD-SHELL", "apk add curl && curl --fail http://localhost:8090/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  docker-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
